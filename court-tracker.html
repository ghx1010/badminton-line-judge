<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>羽毛球场边界跟踪演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15251a;color:#f4fff5;font-family:system-ui,"Microsoft YaHei",sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}.app{width:min(760px,100%)}h1{font-size:22px;font-weight:600;margin:0 0 12px}.scene{position:relative;aspect-ratio:1/1.22;overflow:hidden;background:linear-gradient(125deg,#243626,#395d3d);box-shadow:0 14px 40px #0008}.floor{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#ffffff28,transparent 55%),repeating-linear-gradient(12deg,transparent 0 30px,#0000000d 31px 32px)}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.label{position:absolute;left:16px;top:16px;background:#0009;padding:7px 10px;font-size:14px}.camera{position:absolute;right:16px;top:16px;background:#28c74c;color:#062609;border:0;padding:9px 14px;font-weight:700;cursor:pointer}svg{position:absolute;inset:0;width:100%;height:100%}.court{fill:#ffffff0b;stroke:#ffffffb3;stroke-width:2}.mark{fill:none;stroke:#ffffffa6;stroke-width:1.4}.tracked{fill:#26cd4a1c;stroke:#26cd4a;stroke-width:4;stroke-linejoin:round;filter:drop-shadow(0 0 4px #26cd4ab3)}.corner{fill:#26cd4a}.caption{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px;color:#cce4d0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#26cd4a;box-shadow:0 0 7px #26cd4a;margin-right:7px}.muted{color:#aac2af;font-size:14px}
</style></head>
<body><main class="app"><h1>羽毛球场边界跟踪</h1><div class="scene"><div class="floor"></div><video id="camera" autoplay playsinline muted></video><canvas id="analysis" width="240" height="294" hidden></canvas><div id="state" class="label">演示模式 · 跟踪中</div><button id="cameraButton" class="camera" type="button">打开摄像头</button><svg viewBox="0 0 680 830" aria-label="绿色边界叠加在羽毛球场上"><polygon class="court" points="170,55 510,55 640,770 40,770"/><line class="mark" x1="206" y1="255" x2="474" y2="255"/><line class="mark" x1="123" y1="574" x2="557" y2="574"/><line class="mark" x1="340" y1="55" x2="340" y2="770"/><line class="mark" x1="87" y1="675" x2="593" y2="675"/><polygon id="outline" class="tracked" points="170,55 510,55 640,770 40,770"/><g id="corners"><circle class="corner" cx="170" cy="55" r="6"/><circle class="corner" cx="510" cy="55" r="6"/><circle class="corner" cx="640" cy="770" r="6"/><circle class="corner" cx="40" cy="770" r="6"/></g></svg></div><p><span class="dot"></span>绿色线：当前识别到的场地边界 <span id="confidence" class="muted" style="float:right">等待摄像头</span></p></main>
<script>
const outline=document.getElementById('outline'),corners=[...document.querySelectorAll('#corners circle')],confidence=document.getElementById('confidence'),button=document.getElementById('cameraButton'),video=document.getElementById('camera'),state=document.getElementById('state'),canvas=document.getElementById('analysis'),ctx=canvas.getContext('2d',{willReadFrequently:true}),base=[[170,55],[510,55],[640,770],[40,770]];let t=0,stream,smoothed;
function paint(points){outline.setAttribute('points',points.map(p=>p.join(',')).join(' '));corners.forEach((el,i)=>{el.setAttribute('cx',points[i][0]);el.setAttribute('cy',points[i][1])})}
function median(values){values.sort((a,b)=>a-b);return values[Math.floor(values.length/2)]}
function detect(){if(!stream||video.readyState<2){requestAnimationFrame(detect);return}ctx.drawImage(video,0,0,canvas.width,canvas.height);const {data}=ctx.getImageData(0,0,canvas.width,canvas.height),w=canvas.width,h=canvas.height,rows=[],lum=(x,y)=>{const i=(y*w+x)*4;return(data[i]+data[i+1]+data[i+2])/3};for(let y=Math.floor(h*.08);y<h*.95;y+=3){let left=w,right=-1,count=0;for(let x=3;x<w-3;x+=2){const here=lum(x,y),horizontal=Math.abs(lum(x-3,y)-lum(x+3,y)),vertical=Math.abs(lum(x,y-3)-lum(x,y+3)),contrast=Math.max(horizontal,vertical);if(contrast>95&&here>20&&here<240){left=Math.min(left,x);right=Math.max(right,x);count++}}if(count>5&&right-left>w*.24)rows.push([y,left,right])}if(rows.length>12){const top=rows.slice(0,Math.max(4,Math.floor(rows.length*.18))),bottom=rows.slice(-Math.max(4,Math.floor(rows.length*.18)));const next=[[median(top.map(r=>r[1]))*680/w,median(top.map(r=>r[0]))*830/h],[median(top.map(r=>r[2]))*680/w,median(top.map(r=>r[0]))*830/h],[median(bottom.map(r=>r[2]))*680/w,median(bottom.map(r=>r[0]))*830/h],[median(bottom.map(r=>r[1]))*680/w,median(bottom.map(r=>r[0]))*830/h]];smoothed=smoothed?smoothed.map((p,i)=>p.map((v,j)=>v*.78+next[i][j]*.22)):next;paint(smoothed);const score=Math.min(99,Math.round(55+rows.length/2));confidence.textContent='边缘置信度 '+score+'%';state.textContent='实时几何跟踪中'}else{confidence.textContent='未找到足够场地边缘';state.textContent='请让完整场地线进入画面'}requestAnimationFrame(detect)}
setInterval(()=>{if(stream)return;t+=.15;paint(base.map(([x,y],i)=>[x+Math.sin(t+i*1.7)*3,y+Math.cos(t*1.2+i)*3]));confidence.textContent='演示模式'},160);button.addEventListener('click',async()=>{if(stream){stream.getTracks().forEach(track=>track.stop());stream=undefined;smoothed=undefined;video.style.display='none';state.textContent='演示模式 · 跟踪中';button.textContent='打开摄像头';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});video.srcObject=stream;video.style.display='block';button.textContent='关闭摄像头';requestAnimationFrame(detect)}catch{state.textContent='未获得摄像头权限'}});
</script></body></html>
